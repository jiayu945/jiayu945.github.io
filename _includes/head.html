{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  /* 1. 全局普通文字链接的悬停特效（只变蓝色，不变背景） */
  a:hover {
    color: #007bff !important;
  }

  /* 2. 全局“按钮”类链接的悬停特效（变蓝底白字） */
  /* 如果在 Markdown 里给链接加上了 {: .btn}，或者自带 btn 类的元素，就会应用这个效果 */
  .btn:hover, 
  .talks-list a:hover, 
  .publications-list a:hover {
    background-color: #007bff !important;
    color: white !important;
    border-color: #007bff !important;
    text-decoration: none;
  }
</style>
